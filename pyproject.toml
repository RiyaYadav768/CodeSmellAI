[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesmell-ai"
version = "0.1.0"
description = "Analyze Python repository structure, code smells, history, and risk."
requires-python = ">=3.9"
dependencies = [
    "GitPython>=3.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pandas>=2.1",
]

[project.scripts]
codesmell-ai = "main:main"

[tool.setuptools]
py-modules = [
    "ai_insights",
    "export_csv",
    "format_pr_comment",
    "git_miner",
    "graph_builder",
    "graph_visualizer",
    "main",
    "metrics",
    "parser",
    "risk_scorer",
    "scanner",
    "smell_detector",
]