name: CodeSmellAI PR Risk Analysis
description: Analyze a pull request and publish changed-file risk details as a comment.
# Shield signals repository risk analysis; orange highlights caution.
branding:
  icon: shield
  color: orange
inputs:
  risk-threshold-warning:
    description: Minimum risk score that receives warning styling in the comment.
    required: false
    default: "40"
  top-n-files:
    description: Maximum number of changed Python files to detail in the comment.
    required: false
    default: "15"
  fail-on-high-risk:
    description: Fail the check after commenting if any changed file is High Risk.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Check out pull request repository
      uses: actions/checkout@v4
      with:
        path: codesmell-ai-target
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
        cache: pip
        cache-dependency-path: ${{ github.action_path }}/pyproject.toml

    - name: Install CodeSmellAI
      shell: bash
      run: python -m pip install "${{ github.action_path }}"

    - name: Analyze complete repository
      id: analyze
      shell: bash
      working-directory: ${{ github.action_path }}
      # Composite steps do not support timeout-minutes; 600 seconds bounds long scans while allowing typical repositories to finish.
      run: |
        python - <<'PY'
        import os
        import subprocess

        subprocess.run(
          ["codesmell-ai", "--repo-path", os.path.join(os.environ["GITHUB_WORKSPACE"], "codesmell-ai-target")],
            timeout=600,
            check=True,
        )
        PY

    - name: Report analysis failure on pull request
      if: failure() && steps.analyze.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const pullNumber = context.payload.pull_request?.number;
          if (!pullNumber) {
            core.warning('CodeSmellAI analysis failed outside a pull request; see the Actions log for details.');
            return;
          }
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pullNumber,
            body: `CodeSmellAI analysis failed - see the Actions log for details: ${runUrl}`
          });

    - name: Get changed files from pull request diff
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [[ -z "$BASE_REF" || -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
          echo "CodeSmellAI must run on a pull_request event with base and head refs." >&2
          exit 1
        fi
        git -C "$GITHUB_WORKSPACE/codesmell-ai-target" diff --name-only --diff-filter=ACMRTD \
          "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/codesmell-ai-changed-files.txt"

    - name: Format PR comment
      id: format
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        CHANGED_FILES: ${{ runner.temp }}/codesmell-ai-changed-files.txt
        COMMENT_FILE: ${{ runner.temp }}/codesmell-ai-comment.md
      run: >-
        python format_pr_comment.py
        --metrics metrics.csv
        --changed-files "$CHANGED_FILES"
        --top-n-files "${{ inputs.top-n-files }}"
        --risk-threshold-warning "${{ inputs.risk-threshold-warning }}"
        --output "$COMMENT_FILE"
        --github-output "$GITHUB_OUTPUT"

    - name: Add analysis results to job summary
      shell: bash
      env:
        COMMENT_FILE: ${{ runner.temp }}/codesmell-ai-comment.md
      run: cat "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"

    - name: Create or update pull request comment
      uses: actions/github-script@v7
      env:
        COMMENT_FILE: ${{ runner.temp }}/codesmell-ai-comment.md
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- codesmell-ai-report -->';
          const pull_number = context.payload.pull_request.number;
          const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pull_number,
            per_page: 100
          });
          const existing = comments.find(comment => comment.body && comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
            core.info(`Updated CodeSmellAI comment ${existing.id}`);
          } else {
            const created = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull_number,
              body
            });
            core.info(`Created CodeSmellAI comment ${created.data.id}`);
          }

    - name: Fail check for High Risk files
      if: inputs.fail-on-high-risk == 'true' && steps.format.outputs.has-high-risk == 'true'
      shell: bash
      run: |
        echo "CodeSmellAI found one or more changed files with High Risk. See the pull request comment."
        exit 1